<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Brailed accessibility controller system</title>
  <desc id="desc">A tactile six-key Braille input connects through an ESP32 and Bluetooth to an Android phone and Jac agent.</desc>
  <rect width="1200" height="900" fill="#172126"/>
  <g fill="none" stroke="#f5f1e8" stroke-width="5">
    <rect x="90" y="110" width="330" height="680" rx="42"/>
    <rect x="780" y="110" width="330" height="680" rx="42"/>
    <path d="M420 450h135M645 450h135" stroke-dasharray="14 14"/>
  </g>
  <g fill="#f5f1e8">
    <circle cx="195" cy="295" r="43"/>
    <circle cx="315" cy="295" r="43"/>
    <circle cx="195" cy="420" r="43"/>
    <circle cx="315" cy="420" r="43"/>
    <circle cx="195" cy="545" r="43"/>
    <circle cx="315" cy="545" r="43"/>
    <rect x="155" y="650" width="200" height="70" rx="18" fill="#a7472b"/>
    <rect x="830" y="185" width="230" height="110" rx="14" fill="#244c5a"/>
    <rect x="830" y="345" width="230" height="220" rx="14" fill="#f5f1e8"/>
    <rect x="830" y="620" width="230" height="85" rx="14" fill="#a7472b"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="255" y="185" fill="#f5f1e8" font-size="30" font-weight="700">BRAILLE INPUT</text>
    <text x="255" y="694" fill="#f5f1e8" font-size="25" font-weight="700">SEND</text>
    <text x="600" y="370" fill="#f5f1e8" font-size="34" font-weight="700">ESP32</text>
    <text x="600" y="410" fill="#c9c3b7" font-size="24">CHORD STATE MACHINE</text>
    <text x="600" y="530" fill="#f5f1e8" font-size="27" font-weight="700">BLE GATT</text>
    <text x="945" y="250" fill="#f5f1e8" font-size="27" font-weight="700">ANDROID</text>
    <text x="945" y="430" fill="#172126" font-size="34" font-weight="700">JAC</text>
    <text x="945" y="470" fill="#5f6767" font-size="23">byLLM + allow-list</text>
    <text x="945" y="668" fill="#f5f1e8" font-size="27" font-weight="700">OLED FEEDBACK</text>
    <text x="90" y="855" fill="#c9c3b7" font-size="22" text-anchor="start">BRAILED · JACHACKS SF 2026 · 2ND PLACE</text>
  </g>
</svg>
